<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StudyPilot</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--tx:#1b1b2f;--mu:#6b6b83;--ac:#5b4bff;--ac2:#eceaff;--bd:#e3e3ee;--ok:#16a34a;--no:#dc2626;--wn:#d97706;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12121c;--card:#1c1c2b;--tx:#ececf6;--mu:#9a9ab5;--ac:#8b7fff;--ac2:#2a2748;--bd:#2d2d44;--ok:#4ade80;--no:#f87171;--wn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12121c;--card:#1c1c2b;--tx:#ececf6;--mu:#9a9ab5;--ac:#8b7fff;--ac2:#2a2748;--bd:#2d2d44;--ok:#4ade80;--no:#f87171;--wn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 4px}
textarea,input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px}.row>div{flex:1}
.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.go:disabled{opacity:.5}
.err{color:var(--no);font-size:14px;margin-top:8px}
.warn{background:var(--ac2);padding:10px;border-radius:10px;font-size:14px;margin-bottom:12px}
.t{display:flex;gap:10px}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ac2);color:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--ac2);margin-right:4px}
.why{color:var(--mu);font-size:14px;margin-top:2px}
.out{white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,transparent)}
.chips button{margin:4px 4px 0 0;padding:4px 10px;border:1px solid var(--bd);border-radius:99px;background:var(--card);color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
[hidden]{display:none!important}
</style></head><body><main>
<h1>📚 StudyPilot</h1>
<p class="sub">Know what to study first, learn how to solve it, then test yourself.</p>
<div class="warn" id="warn" hidden>The AI isn’t available in this view. Open the page from its link while signed in to Claude.</div>
<nav><button data-t="plan" class="on">Planner</button><button data-t="solve">Solve</button><button data-t="quiz">Quiz</button></nav>

<section id="plan">
<div class="card">
<label for="syl">Paste your syllabus or portion</label>
<textarea id="syl" placeholder="Chapters, topics, units…"></textarea>
<div class="row"><div><label for="dt">Exam date</label><input id="dt" type="date"></div>
<div><label for="hrs">Hours per day</label><input id="hrs" type="number" min="1" max="16" value="3"></div></div>
<button class="go" id="pgo">Build my plan</button><div class="err" id="perr"></div>
</div>
<div id="pout"></div>
</section>

<section id="solve" hidden>
<div class="card">
<label for="q">Paste a question or problem</label>
<textarea id="q" placeholder="e.g. A ball is thrown up at 20 m/s. How high does it go?"></textarea>
<button class="go" id="sgo">Show me how to solve it</button><div class="err" id="serr"></div>
</div>
<div class="card out" id="sout" hidden></div>
</section>

<section id="quiz" hidden>
<div class="card">
<label for="qt">Topic to revise</label>
<input id="qt" placeholder="Type a topic, or tap one from your plan">
<div class="chips" id="chips"></div>
<button class="go" id="qgo">Start quiz</button><div class="err" id="qerr"></div>
</div>
<div id="qout"></div>
</section>
</main>
<script>
let topics=[];
const call=async(prompt,json)=>{const r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,json})});
 if(r.status===429)throw new Error("Too many requests right now, wait a minute and retry.");
 let d={};try{d=await r.json()}catch(e){}
 if(!r.ok)throw new Error(d.error||"Something went wrong, try again.");return d.text};
const sample=async(p,o)=>{const t=await call(p,false);if(o&&o.onText)o.onText({text:t});return t};
sample.json=async p=>{const t=await call(p,true);return JSON.parse(t.replace(/```json|```/g,"").trim())};
const $=id=>document.getElementById(id);
const h=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
 ["plan","solve","quiz"].forEach(s=>$(s).hidden=s!==b.dataset.t)});
const d=new Date();d.setDate(d.getDate()+14);$("dt").value=d.toISOString().slice(0,10);
async function run(btn,errEl,fn){errEl.textContent="";btn.disabled=true;const old=btn.textContent;btn.textContent="Thinking…";
 try{await fn()}
 catch(e){errEl.textContent=e&&e.code==="rate_limited"?"Too many requests, wait a moment and retry.":(e&&e.message)||"Something went wrong, try again."}
 btn.disabled=false;btn.textContent=old}

$("pgo").onclick=()=>run($("pgo"),$("perr"),async()=>{
 const s=$("syl").value.trim();if(!s)throw new Error("Paste your syllabus first.");
 const today=new Date().toISOString().slice(0,10);
 const days=Math.max(1,Math.ceil((new Date($("dt").value)-new Date(today))/864e5));
 const r=await sample.json(`Today is ${today}. The student’s exam is in ${days} days and they can study ${$("hrs").value||3} hours per day.\nMaterial:\n${s}\n\nRank what to study first, weighing urgency and difficulty (hard and foundational topics early). Return ONLY JSON: {"topics":[{"name":string,"difficulty":"easy"|"medium"|"hard","urgency":"high"|"medium"|"low","hours":number,"why":string under 15 words}],"plan":[{"day":string,"focus":string}]}. Max 12 topics, ordered by study priority. Plan has at most 7 entries (group days if needed) and ends with revision.`);
 topics=r.topics||[];const o=$("pout");o.textContent="";
 const c=h("div","card");c.append(h("b","","Study order"));
 topics.forEach((t,i)=>{const w=h("div","t");w.style.marginTop="12px";w.append(h("div","n",i+1));
  const b=h("div");const l=h("div");l.append(h("b","",t.name+" "),h("span","tag",t.difficulty),h("span","tag","urgency: "+t.urgency),h("span","tag",t.hours+"h"));
  b.append(l,h("div","why",t.why));w.append(b);c.append(w)});
 o.append(c);
 const p=h("div","card");p.append(h("b","","Schedule"));
 (r.plan||[]).forEach(x=>{const l=h("div","why");l.style.marginTop="8px";l.append(h("b","",x.day+": "),document.createTextNode(x.focus));p.append(l)});
 o.append(p);
 $("chips").textContent="";topics.forEach(t=>{const b=h("button","",t.name);b.onclick=()=>{$("qt").value=t.name;document.querySelector('[data-t="quiz"]').click()};$("chips").append(b)});
});

$("sgo").onclick=()=>run($("sgo"),$("serr"),async()=>{
 const q=$("q").value.trim();if(!q)throw new Error("Paste a question first.");
 const o=$("sout");o.hidden=false;o.textContent="Thinking…";
 await sample(`You are a patient tutor. Solve this step by step: name the concept, list what is given and what is asked, work through numbered steps, state the final answer, then add one tip to avoid the common mistake. Plain text only, no markdown symbols.\n\nQuestion:\n${q}`,{onText:({text})=>{o.textContent=text}});
});

$("qgo").onclick=()=>run($("qgo"),$("qerr"),async()=>{
 const t=$("qt").value.trim();if(!t)throw new Error("Enter a topic first.");
 const qs=await sample.json(`Write 5 multiple-choice questions testing real understanding of: ${t}. Mix easy and hard. Return ONLY a JSON array: [{"q":string,"options":[4 strings],"answer":index 0-3,"explain":string under 25 words}]`);
 let i=0,score=0;const o=$("qout");
 const show=()=>{o.textContent="";
  if(i>=qs.length){const c=h("div","card");c.append(h("b","",`Score: ${score}/${qs.length}`),h("div","why",score>=qs.length-1?"Solid. This one has stuck.":"Review this topic again, then retake the quiz."));o.append(c);return}
  const x=qs[i],c=h("div","card");c.append(h("div","why",`Question ${i+1} of ${qs.length}`),h("b","",x.q));
  const ex=h("div","why");ex.style.marginTop="10px";
  x.options.forEach((op,k)=>{const b=h("button","opt",op);b.onclick=()=>{
   c.querySelectorAll(".opt").forEach((y,j)=>{y.disabled=true;if(j===x.answer)y.classList.add("ok")});
   if(k===x.answer)score++;else b.classList.add("no");
   ex.textContent=x.explain;const n=h("button","go",i+1<qs.length?"Next":"See score");n.onclick=()=>{i++;show()};c.append(n)};c.append(b)});
  c.append(ex);o.append(c)};
 show();
});
</script></body></html>
